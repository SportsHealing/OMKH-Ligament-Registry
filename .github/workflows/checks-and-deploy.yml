name: Checks and deploy

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: C1 to C3 content checks
        run: ./scripts/checks.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: C4 accessibility (axe)
        run: |
          npm install --no-save playwright@1.48.2 @axe-core/playwright@4.10.0
          npx playwright install --with-deps chromium
          node scripts/a11y.mjs
      - name: C5 secret scan (gitleaks)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks detect --source . --redact --verbose

  deploy:
    needs: checks
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Build site folder (drop concept HTML that loads Google Fonts, R13)
        run: |
          mkdir _site
          rsync -a --exclude '.git' --exclude '.github' --exclude 'scripts' --exclude 'docs/designs/*.html' ./ _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
